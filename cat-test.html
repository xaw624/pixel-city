<!doctype html><html><head><meta charset="utf-8"><title>cat test</title>
<style>body{margin:0;background:#222}</style></head><body><canvas id="o"></canvas>
<script src="package/contents/ui/scene.js"></script>
<script>
// Fotogramas del anuncio del gato a distintos tiempos del ciclo, para revisarlo.
var seed = 1, w; do { w = create(480, 270, seed++, { style: "classic" }); } while (!w.catAds.some(function (q) { return q.x > 4 && q.x + q.w < 470 && q.y > 4; }) && seed < 300);
var Z = 6, o = document.getElementById("o"), x = o.getContext("2d");
var bb = w.catAds.filter(function (q) { return q.x > 4 && q.x + q.w < 470 && q.y > 4; })[0]; bb.ph = 0;
var times = [1, 3, 5, 7.2, 8.4, 9.9, 12, 15], P = palette(w, 13);
o.width = times.length * (bb.w + 4) * Z; o.height = (bb.h + 6) * Z * 2;
x.imageSmoothingEnabled = false;
[13, 22].forEach(function (h, row) {
  P = palette(w, h);
  times.forEach(function (tt, i) {
    var c = document.createElement("canvas"); c.width = 480; c.height = 270;
    var cx = c.getContext("2d");
    var b = w.layers[2].filter(function (q) { return q.billboard === bb; })[0];
    drawBuilding(cx, w, b, P, 0, h, false);
    drawCatAd(cx, bb, P, tt);
    x.drawImage(c, bb.x - 2, bb.y - 2, bb.w + 4, bb.h + 6, i * (bb.w + 4) * Z, row * (bb.h + 6) * Z, (bb.w + 4) * Z, (bb.h + 6) * Z);
  });
});
</script></body></html>
